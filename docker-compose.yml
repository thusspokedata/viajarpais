# viajarpais en la Pi `nextcloud`. Publica 0.0.0.0:3006 en el host
# (lo consume el reverse proxy del VPS por el tunel WireGuard).
# restart: unless-stopped + docker.service enabled => sobrevive reboots.
#
# Deploy: lo corre el self-hosted runner (.github/workflows/deploy.yml)
# en cada push a main. El runner hace checkout del repo, copia el app.env
# (secrets, vive solo en la Pi) al lado de este compose, y `up -d --build`.
name: viajarpais

services:
  web:
    build:
      context: .
      args:
        # Publicas (no secretas): se hornean en el bundle en build-time.
        NEXT_PUBLIC_SITE_URL: "https://viajarpais.com.ar"
        NEXT_PUBLIC_BETTER_AUTH_URL: "https://viajarpais.com.ar"
    image: viajarpais:latest
    container_name: viajarpais
    restart: unless-stopped
    # Secrets/runtime env (DATABASE_URL, BETTER_AUTH_SECRET, etc.).
    # app.env NO esta en git ni se hornea en la imagen (ver .dockerignore);
    # el runner lo copia desde /home/kilo/viajarpais/app.env antes del build.
    env_file:
      - app.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3006:3006"
    # Apunta a /api/health, que NO toca la DB. Antes pegaba a `/`
    # (force-dynamic, 2 queries Prisma por request) cada 30s: eso mantenia
    # el compute de Neon despierto 24/7 y agoto la cuota mensual.
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3006/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20m
      timeout: 10s
      retries: 3
      start_period: 60s

  # Postgres propia en la Pi (reemplaza a Neon, que agotaba la cuota de
  # compute del plan free). Sin `ports`: solo la alcanza `web` por la red
  # interna de compose (DATABASE_URL=postgresql://...@db:5432/viajarpais).
  # Credenciales en db.env (vive solo en la Pi, como app.env).
  # Backups: pg_dump + restic off-site, ver infra/pi/.
  db:
    image: postgres:18-alpine
    container_name: viajarpais-db
    restart: unless-stopped
    env_file:
      - db.env
    # Desde Postgres 18 la imagen usa PGDATA=/var/lib/postgresql/18/docker,
    # asi que el volumen se monta en el padre.
    # OJO: `docker compose down -v` borra este volumen = borra la DB.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s

volumes:
  pgdata:
